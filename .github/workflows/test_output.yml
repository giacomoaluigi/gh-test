name: Test Output

on:
  push:
    branches:
      - main
permissions:
  contents: read # This is required for actions/checkout

jobs:
  example_job:
    runs-on: ubuntu-latest
    outputs:
      step1_output: ${{ steps.step1.outputs.output_name }}
      step2_output: ${{ steps.step2.outputs.another_output }}
    steps:
      - id: step1
        run: echo "output_name=some_value" >> "$GITHUB_OUTPUT"
      - id: step2
        run: echo "another_output=another_value" >> "$GITHUB_OUTPUT"

  another_job:
    runs-on: ubuntu-latest
    needs: example_job
    steps:
      - id: step1
        run: echo "step1 output " ${{ needs.example_job.outputs.step1_output }}
      - id: step2
        run: echo "step2 output " ${{ needs.example_job.outputs.step2_output }}
